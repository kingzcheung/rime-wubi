# Rime schema
# encoding: utf-8
# T9 拼音九键（与 pinyin_simp 共享字典）
# 参考雾凇拼音方案：数字序列直接由 RIME speller algebra 展开，
# 引擎原生处理数字→拼音转换和多音节歧义消解。
# 左侧候选区由 T9PinyinMap librime-t9 计算展示。
t9:
  # 适应元书输入法的配置，是否显示 rime 中原始的预编辑文本，默认为 true
  # true: 对 preedit 不做处理，显示 rime 返回的原始 preedit 值。
  #       如果想通过 lua 自己调整 preedit 的显示，可以设置为 true。
  # false: 根据候选字 comment 显示转换后的 preedit 内容。
  #        注意：请务必保证候选字 comment 有效且正确，否则可能导致预编辑文本显示异常。
  isDisplayOriginalPreedit: false

  # 日期翻译器开关（true=开启，false=关闭） 参考白霜实现，感谢白霜方案
  enable_date_translator: true

  # 超越输入序列长度，借助简拼匹配长词召回开关（true=开启，false=关闭）
  # 通过补丁注入 derive 简拼，让"几乎把/几乎从"等简拼长词能被 RIME 原生召回。
  # 默认开启；关闭后简拼匹配长词不召回（仅完整拼音词、单字）。
  enable_abbrev_recall: true

  # 日期翻译器触发词配置 参考白霜实现，感谢白霜方案
  date_translator:
    date: rq
    time: sj
    week: xq
    datetime: dt
    timestamp: ts
    lunar: nl
    # 候选插入位置（默认 2，即第二位）
    idx: 2

schema:
  schema_id: t9_pinyin
  name: 拼音九键
  version: "2.0"
  description: |
    拼音九键方案，使用 ABC/DEF/GHI/JKL/MNO/PQRS/TUV/WXYZ 键位

# 开关
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - t9_processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - t9_date_translator
    - punct_translator
    - script_translator
  filters:
    - t9_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba9876543210
  initials: zyxwvutsrqponmlkjihgfedcba9876543210
  delimiter: " '"
  algebra:
    # 简拼规则
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 拼音容错规则
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 九宫格数字映射（derive 创建双向映射：数字↔字母）
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[hgi]/4/
    - derive/[jkl]/5/
    - derive/[omn]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/

translator:
  dictionary: pinyin_simp
  prism: t9_pinyin
  spelling_hints: 100
  always_show_comments: true
  comment_format: []
  preedit_format:
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

punctuator:
  import_preset: default

recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"

key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }

editor:
  bindings:
    space: confirm
