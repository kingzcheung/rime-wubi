schema:
  schema_id: wubi98
  name: "五笔98"
  version: "24.05.29"
  author:
    - 發明人 王永民
    - 修改者 yanhuacuo <https://github.com/yanhuacuo/98wubi>
  description: |
    基于五笔98版进行配置

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
    reset: 0

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

translator:
  dictionary: wubi98
  prism: wubi98
  enable_charset_filter: true
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: true

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  max_code_length: 4
  auto_select: true
  auto_select_unique_candidate: true

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: space, send: 1 }
    - { when: composing, accept: space, send: 1 }

recognizer:
  import_preset: default

menu:
  page_size: 20